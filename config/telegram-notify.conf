# Action уведомлений Fail2ban в Telegram
# Путь после развёртывания: /etc/fail2ban/action.d/telegram-notify.conf
#
# Когда fail2ban вызывает событие ban/unban, используется скрипт-мост
# f2b-manager для отправки уведомления в Telegram.
#
# Файл развёртывается f2b-manager автоматически. Не изменяйте его вручную.

[Definition]

# ── Уведомления о запуске и остановке сервиса ──
# Уведомление при запуске jail
actionstart = /usr/local/bin/f2b-notify.sh "start" "<name>"

# Уведомление при остановке jail
actionstop = /usr/local/bin/f2b-notify.sh "stop" "<name>"

# ── Команда проверки (пустая операция) ──
actioncheck =

# ── ★ Основное: уведомление о блокировке ──
# <ip>       - заблокированный IP-адрес
# <name>     - имя jail
# <failures> - количество неудачных попыток
# <matches>  - совпавшие строки журнала (могут быть длинными; скрипт берёт первые 500 символов)
actionban = /usr/local/bin/f2b-notify.sh "ban" "<ip>" "<name>" "<failures>" "<matches>"

# ── ★ Основное: уведомление о разблокировке ──
actionunban = /usr/local/bin/f2b-notify.sh "unban" "<ip>" "<name>"

# ── Настройка поведения ──
# Отключить запуск по требованию, чтобы actionstart выполнялся при запуске сервиса
actionstart_on_demand = false

[Init]
# Имя скрипта уведомлений
name = default
